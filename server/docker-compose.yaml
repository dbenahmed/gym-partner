services:
  db:
    image: postgres:15-alpine
    # The container will always restart unless stopped manually
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lenovo
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Check if postgres is ready to accept connections
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
  # For Now we will be using only the database as a dockerized environment
  # the api will be dockerized in the feature
  # the reason for this is that the api is currently in development and will be changed frequently
  # and restarting the container on every change is time consuming
  # also to make the development process easier

